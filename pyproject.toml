[build-system]
requires = ["scikit-build-core", "numpy", "scipy_openblas32"]
build-backend = "scikit_build_core.build"

[project]
name = "f77ex"
version = "0.0.1"
dependencies = ["numpy"]

[tool.scikit-build]
ninja.version = ">=1.10"
cmake.version = ">=3.17.2"

[tool.cibuildwheel]
test-command = "python -m f77ex.test.test_mat_det"

[tool.cibuildwheel.macos]
before-build = "bash {project}/tools/cibw_before_build_macos.sh"
repair-wheel-command = "bash {project}/tools/cibw_repair_wheel_macos.sh {dest_dir} {wheel}"

[tool.cibuildwheel.windows]
before-build = "pip install delvewheel"
repair-wheel-command = [
  "pip install scipy_openblas32",
  "python tools/delvewheel_wrapper.py repair -w {dest_dir} {wheel}"
]
